<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fast Draw Speaking</title>
  <link rel="icon" href="data:,">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
      --accent-green: #34d399;
      --accent-red: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg-gradient);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
    }

    .app-container {
      width: 100%; height: 100vh; height: 100dvh;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 16px;
      max-width: 480px; margin: 0 auto;
    }

    /* ナビゲーションヘッダー */
    header {
      flex-shrink: 0; display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: var(--glass-bg); backdrop-filter: blur(12px);
      border-radius: 20px; border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
    }

    .nav-tabs { display: flex; gap: 6px; }

    .tab-btn {
      background: transparent; border: none; color: var(--text-muted);
      padding: 6px 14px; border-radius: 12px; font-size: 0.8rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.15); color: #ffffff;
      border: 1px solid var(--glass-border);
    }

    #scene-id {
      font-size: 0.75rem; font-weight: 600; background: rgba(255, 255, 255, 0.1);
      padding: 4px 10px; border-radius: 16px; border: 1px solid var(--glass-border);
    }

    /* ビュー切り替え */
    .view-screen {
      flex: 1; display: none; flex-direction: column; justify-content: center;
      gap: 12px; overflow-y: auto; padding: 12px 0;
    }
    .view-screen.active { display: flex; }

    /* 学習ビュー用カード */
    .card {
      background: var(--glass-bg); backdrop-filter: blur(16px);
      border-radius: 20px; padding: 16px 20px; border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow); display: flex; flex-direction: column; gap: 6px;
    }
    .card .en { font-size: 1.15rem; font-weight: 600; color: #60a5fa; }
    .card .ja { font-size: 0.9rem; color: var(--text-muted); }

    /* タイピングビュー用カード */
    .typing-card {
      background: var(--glass-bg); backdrop-filter: blur(16px);
      border-radius: 24px; padding: 24px 20px; border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow); text-align: center; display: flex; flex-direction: column; gap: 16px;
    }

    .timer-bar-container {
      width: 100%; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; overflow: hidden;
    }
    #timer-bar {
      width: 100%; height: 100%; background: var(--accent-green); transition: width 0.05s linear;
    }

    .target-ja { font-size: 1.3rem; font-weight: 700; color: #ffffff; min-height: 2.4em; display: flex; align-items: center; justify-content: center; }
    
    .type-input {
      width: 100%; height: 50px; background: rgba(0, 0, 0, 0.2); border: 2px solid var(--glass-border);
      border-radius: 14px; color: #fff; font-size: 1.1rem; text-align: center; outline: none;
      transition: all 0.2s;
    }
    .type-input:focus { border-color: #6366f1; }
    .type-input.correct { border-color: var(--accent-green); background: rgba(52, 211, 153, 0.15); }
    .type-input.wrong { border-color: var(--accent-red); background: rgba(248, 113, 113, 0.15); }

    .typing-feedback { font-size: 0.85rem; height: 1.2em; color: var(--text-muted); }

    /* アクションボタン */
    .controls { flex-shrink: 0; }
    #next-btn {
      width: 100%; height: 56px; border: none; border-radius: 20px;
      background: var(--accent-gradient); color: #ffffff; font-size: 1rem; font-weight: 600;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5); cursor: pointer;
      display: flex; justify-content: center; align-items: center; gap: 10px;
    }
    #next-btn:active { transform: scale(0.97); }
  </style>
</head>

<body>
  <div class="app-container">
    <header>
      <div class="nav-tabs">
        <button id="tab-study" class="tab-btn active" onclick="switchView('study')">📖 閲覧</button>
        <button id="tab-typing" class="tab-btn" onclick="switchView('typing')">⚡ 早撃ち</button>
      </div>
      <span id="scene-id">SCENE --</span>
    </header>

    <!-- ビュー1: 閲覧（カード学習） -->
    <main id="view-study" class="view-screen active">
      <div id="study-cards-container">
        <div class="card">
          <div class="en">Loading...</div>
          <div class="ja">データを読み込んでいます</div>
        </div>
      </div>
    </main>

    <!-- ビュー2: 早撃ちタイピング -->
    <main id="view-typing" class="view-screen">
      <div class="typing-card">
        <div class="timer-bar-container"><div id="timer-bar"></div></div>
        <div id="typing-ja" class="target-ja">日本語テキスト</div>
        <input type="text" id="typing-input" class="type-input" placeholder="英文を入力..." autocomplete="off" autocapitalize="none" spellcheck="false">
        <div id="typing-feedback" class="typing-feedback">即打ちでスピーキング脳を育成</div>
      </div>
    </main>

    <div class="controls">
      <button id="next-btn">
        <span id="btn-text">次のシーンへ</span>
      </button>
    </div>
  </div>

  <!-- WASMの自動生成ファイル(engine.js)が存在する場合は読み込む -->
  <script src="engine.js"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
