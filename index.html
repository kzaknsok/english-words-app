<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab App</title>

  <style>
    /* ==========================================
    Base System & Modern Reset
    ========================================== */
    :root {
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --accent-color: #2563eb;
    
    /* タグカラー */
    --tag-chunk-bg: #eff6ff;
    --tag-chunk-text: #1d4ed8;
    --tag-idiom-bg: #f0fdf4;
    --tag-idiom-text: #15803d;
    --tag-word-bg: #fff7ed;
    --tag-word-text: #c2410c;

    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.06), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
    }

    * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    }

    /* スマホ全画面対応の基本設定 */
    html, body {
    width: 100%;
    height: 100%;
    overflow: hidden; /* 全体スクロールを防止 */
    background-color: var(--bg-color);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text-main);
    line-height: 1.5;
    }

    /* ==========================================
    App Layout & Container (間隔の均等化)
    ========================================== */
    .app-container {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    /* flexコンテナの空きスペースを要素間に均等配分 */
    justify-content: space-between;
    padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    }

    /* 固定ヘッダー */
    header {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-color);
    /* 下側の余白を自動（margin-bottom: auto）で押し広げる */
    margin-bottom: 16px;
    }

    .brand-title {
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    text-transform: uppercase;
    }

    #scene-id {
    font-size: 0.85rem;
    font-weight: 600;
    background-color: var(--bg-color);
    padding: 4px 10px;
    border-radius: 20px;
    color: var(--text-main);
    border: 1px solid var(--border-color);
    }

    /* 中央コンテンツエリア */
    #content-container {
    /* flex: 1 から変更し、コンテンツの高さに応じて伸びつつ余白を作れるように調整 */
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: center; /* カードが少ない時は上下中央寄りに配置 */
    gap: 14px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    margin-top: auto;
    margin-bottom: auto;
    }

    /* スクロールバーの非表示 */
    #content-container::-webkit-scrollbar {
    display: none;
    }
    #content-container {
    -ms-overflow-style: none;
    scrollbar-width: none;
    }

    /* ==========================================
    Bottom Controls
    ========================================== */
    .controls {
    flex-shrink: 0;
    /* 上側の余白をしっかり開ける */
    margin-top: 16px;
    }

    #next-btn {
    width: 100%;
    height: 56px;
    border: none;
    border-radius: 16px;
    background: var(--accent-color);
    color: #ffffff;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    box-shadow: var(--shadow-lg);
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    transition: background-color 0.2s ease, transform 0.1s ease;
    }

    #next-btn:active {
    transform: scale(0.98);
    background-color: #1d4ed8;
    }

    #next-btn:disabled {
    background-color: #cbd5e1;
    box-shadow: none;
    cursor: not-allowed;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="card-header">
      <span class="scene-title" id="scene-id">SCENE --</span>
    </div>

    <div id="content-container">
      <div class="section">
        <span class="tag">System</span>
        <div class="en">Loading...</div>
        <div class="ja">データを読み込んでいます</div>
      </div>
    </div>

    <button id="next-btn" class="btn-action">次へ表示</button>
  </main>

  <script>
    var Module = {
      onRuntimeInitialized: function() {
        console.log("WASM runtime initialized.");
        startApp();
      }
    };
  </script>

    <!-- index.html の記述を以下のように変更 -->
    <script src="engine.js?v=2"></script>
    <script src="app.js?v=2"></script>
</body>
</html>
