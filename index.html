<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab App</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
      background-color: #f4f6f8;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 16px;
    }
    .container {
      width: 100%; max-width: 480px; background: #fff;
      border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      padding: 24px; display: flex; flex-direction: column; gap: 16px;
    }
    .card-header { display: flex; justify-content: space-between; padding-bottom: 12px; border-bottom: 2px solid #f0f0f0; }
    .scene-title { font-size: 0.85rem; font-weight: 700; color: #007bff; }
    #content-container { display: flex; flex-direction: column; gap: 12px; }
    .section { background-color: #f8f9fa; border-left: 4px solid #007bff;
      padding: 12px 16px; border-radius: 0 8px 8px 0; display: flex; flex-direction: column; gap: 4px; }
    .section.idiom { border-left-color: #28a745; }
    .section.word { border-left-color: #fd7e14; }
    .tag { font-size: 0.75rem; font-weight: 700; }
    .en { font-size: 1.15rem; font-weight: 700; }
    .ja { font-size: 0.95rem; color: #555; }
    .btn-action {
      width: 100%; padding: 14px; font-size: 1rem; font-weight: 600;
      color: #fff; background-color: #007bff; border: none; border-radius: 10px;
      cursor: pointer; transition: background-color 0.2s ease;
    }
    .btn-action:hover:not(:disabled) { background-color: #0056b3; }
    .btn-action:disabled { background-color: #ccc; cursor: not-allowed; }
  </style>
</head>

<body>
  <main class="container">
    <div class="card-header">
      <span class="scene-title" id="scene-id">SCENE --</span>
    </div>

    <div id="content-container">
      <div class="section">
        <span class="tag">System</span>
        <div class="en">Loading...</div>
        <div class="ja">データを読み込んでいます</div>
      </div>
    </div>

    <button id="next-btn" class="btn-action">次へ表示</button>
  </main>

  <script>
    var Module = {
      onRuntimeInitialized: function() {
        console.log("WASM runtime initialized.");
        startApp();
      }
    };
  </script>

  <!-- app.js を先に、engine.js を後に -->
  <script src="app.js" defer></script>
  <script src="engine.js" defer></script>
</body>
</html>
