<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vocab App</title>
  <link rel="icon" href="data:,">

  <style>
    /* ==========================================
       Base System & Modern Reset
       ========================================== */
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent-color: #2563eb;
      
      /* タグカラー */
      --tag-chunk-bg: #eff6ff;
      --tag-chunk-text: #1d4ed8;
      --tag-idiom-bg: #f0fdf4;
      --tag-idiom-text: #15803d;
      --tag-word-bg: #fff7ed;
      --tag-word-text: #c2410c;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.06), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* 全体スクロールを防止 */
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-main);
      line-height: 1.5;
    }

    /* ==========================================
       App Layout & Container (間隔の均等化)
       ========================================== */
    .app-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
    }

    /* 固定ヘッダー */
    header {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .brand-title {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    #scene-id {
      font-size: 0.85rem;
      font-weight: 600;
      background-color: var(--bg-color);
      padding: 4px 10px;
      border-radius: 20px;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    /* 中央コンテンツエリア */
    #content-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center; /* カードが少ない時は上下中央寄りに配置 */
      gap: 14px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      margin-top: auto;
      margin-bottom: auto;
    }

    /* スクロールバーの非表示 */
    #content-container::-webkit-scrollbar {
      display: none;
    }
    #content-container {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* ==========================================
       Card Component
       ========================================== */
    .section {
      flex-shrink: 0;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: fadeInUp 0.25s ease-out forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tag {
      align-self: flex-start;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      background-color: var(--bg-color);
      color: var(--text-muted);
    }

    .section.chunk .tag {
      background-color: var(--tag-chunk-bg);
      color: var(--tag-chunk-text);
    }

    .section.idiom .tag {
      background-color: var(--tag-idiom-bg);
      color: var(--tag-idiom-text);
    }

    .section.word .tag {
      background-color: var(--tag-word-bg);
      color: var(--tag-word-text);
    }

    .en {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.01em;
      word-break: break-word;
    }

    .ja {
      font-size: 0.925rem;
      color: var(--text-muted);
      font-weight: 400;
      word-break: break-word;
    }

    /* ==========================================
       Bottom Controls
       ========================================== */
    .controls {
      flex-shrink: 0;
      margin-top: 16px;
    }

    #next-btn {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 16px;
      background: var(--accent-color);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      box-shadow: var(--shadow-lg);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    #next-btn:active {
      transform: scale(0.98);
      background-color: #1d4ed8;
    }

    #next-btn:disabled {
      background-color: #cbd5e1;
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <div class="app-container">
    <header>
      <span class="brand-title">Scene Navigator</span>
      <span id="scene-id">SCENE --</span>
    </header>

    <main id="content-container">
      <div class="section">
        <span class="tag">System</span>
        <div class="en">Loading...</div>
        <div class="ja">データを読み込んでいます</div>
      </div>
    </main>

    <div class="controls">
      <button id="next-btn">
        <span>次へ表示</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
    </div>
  </div>

  <script>
    var Module = {
      onRuntimeInitialized: function() {
        console.log("WASM runtime initialized.");
        if (typeof startApp === 'function') {
          startApp();
        }
      }
    };
  </script>

  <script src="engine.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
