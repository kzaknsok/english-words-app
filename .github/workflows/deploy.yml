name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.50

      - name: Compile C to WASM and Build
        run: |
          mkdir -p dist
          emcc engine.c -O3 \
            -s WASM=1 \
            -s EXPORTED_FUNCTIONS='["_init_engine","_set_matrix_cell","_select_next_scene"]' \
            -s EXPORTED_RUNTIME_METHODS='["cwrap"]' \
            -o dist/engine.js
          
          cp index.html app.js words.json dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist